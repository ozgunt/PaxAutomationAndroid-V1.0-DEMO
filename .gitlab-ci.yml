spec:
  inputs:
    single_tag_input:
      default: ""
      description: "SADECE 1 KEZ çalışacak Cucumber tag'ini girin (Örn: @Login veya @Setup). Boş bırakılabilir."
    loop_tag_input:
      default: ""
      description: "Arka arkaya 1000 KEZ döngüde çalışacak stres testi tag'ini girin (Örn: @SatisVeyaIptal). Boş bırakılabilir."

---

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723"
  SINGLE_TAG: "$[[ inputs.single_tag_input ]]"
  LOOP_TAG: "$[[ inputs.loop_tag_input ]]"

stages:
  - build
  - test

compile_project:
  stage: build
  script:
    # Git Bash'in Windows Maven'ı tanıyabilmesi için sonuna .cmd ekledik
    - mvn.cmd clean compile

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  before_script:
    - echo "=== WINDOWS/BASH ORTAMINDA ALTYAPI HAZIRLIGI ==="
    # 1. Arka planda kalmış eski Appium/Node süreçlerini temizler (Windows uyumlu)
    - taskkill //F //IM node.exe //T || echo "Aktif node (Appium) sureci bulunamadi."
    # 2. Appium sunucusunu arka planda başlatıp tüm logları appium.log dosyasına yazar
    - echo "🚀 Appium Sunucusu Arka Planda Baslatiliyor..."
    - start appium --log-level debug --log-no-colors > appium.log 2>&1
    # 3. Sunucunun açılması için 5 saniye bekletir
    - sleep 5
  script:
    - echo "=== TEST KOSUL SURECI BASLIYOR ==="
    - |
      # Git Bash (Linux shell) mantığıyla koşul blokları
      if [ -n "$SINGLE_TAG" ]; then
          echo "🚀 SINGLE_TAG 1 kez kosuluyor -> $SINGLE_TAG"
          mvn.cmd test -Dappium.url=$APPIUM_URL -Dcucumber.filter.tags="$SINGLE_TAG"
      elif [ -n "$LOOP_TAG" ]; then
          echo "🔄 LOOP_TAG 1000 kez donguye giriyor -> $LOOP_TAG"
          for i in {1..1000}; do
              echo "---------------- DONGU NO: $i / 1000 ----------------"
              mvn.cmd test -Dappium.url=$APPIUM_URL -Dcucumber.filter.tags="$LOOP_TAG"
          done
      else
          echo "⚠️ Ozel tag girilmedi, tum testler sirasiyla kosuluyor..."
          mvn.cmd test -Dappium.url=$APPIUM_URL
      fi
  after_script:
    # Testler geçse de kalsa da üretilen son 100 satırlık Appium logunu GitLab paneline basar
    - echo "=== CRITIC APPIUM LOGS ==="
    - if [ -f appium.log ]; then tail -n 100 appium.log; else echo "Appium log dosyasi olusturulamadi!"; fi
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - appium.log
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml