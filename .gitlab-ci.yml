spec:
  inputs:
    single_tag_input:
      default: ""
      description: "SADECE 1 KEZ çalışacak Cucumber tag'ini girin (Örn: @Login veya @Setup). Boş bırakılabilir."
    loop_tag_input:
      default: ""
      description: "Arka arkaya 1000 KEZ döngüde çalışacak stres testi tag'ini girin (Örn: @SatisVeyaIptal). Boş bırakılabilir."

---

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723"
  SINGLE_TAG: "$[[ inputs.single_tag_input ]]"
  LOOP_TAG: "$[[ inputs.loop_tag_input ]]"

stages:
  - build
  - test

compile_project:
  stage: build
  script:
    - mvn clean compile

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  before_script:
    - echo "=== WINDOWS ORTAMINDA ALTYAPI HAZIRLIGI ==="
    # 1. Arka planda kalmış eski Appium/Node süreçlerini temizler
    - taskkill /F /IM node.exe /T || echo "Aktif node (Appium) sureci bulunamadi."
    # 2. Appium sunucusunu arka planda başlatıp tüm logları appium.log dosyasına yazar
    - echo "🚀 Appium Sunucusu Arka Planda Baslatiliyor..."
    - start /B appium --log-level debug --log-no-colors > appium.log 2>&1
    # 3. Sunucunun açılması için 5 saniye bekletir
    - ping 127.0.0.1 -n 6 > nul
  script:
    - echo "=== TEST KOSUL SURECI BASLIYOR ==="
    - |
      powershell -Command "
      if ($env:SINGLE_TAG -ne '') {
          Write-Host '🚀 SINGLE_TAG 1 kez kosuluyor -> ' $env:SINGLE_TAG;
          mvn test -Dappium.url=$env:APPIUM_URL -Dcucumber.filter.tags=$env:SINGLE_TAG;
      }
      elseif ($env:LOOP_TAG -ne '') {
          Write-Host '🔄 LOOP_TAG 1000 kez donguye giriyor -> ' $env:LOOP_TAG;
          for ($i=1; $i -le 1000; $i++) {
              Write-Host \"---------------- DONGU NO: $i / 1000 ----------------\";
              mvn test -Dappium.url=$env:APPIUM_URL -Dcucumber.filter.tags=$env:LOOP_TAG;
          }
      }
      else {
          Write-Host '⚠️ Ozel tag girilmedi, tum testler sirasiyla kosuluyor...';
          mvn test -Dappium.url=$env:APPIUM_URL;
      }"
  after_script:
    # Testler geçse de kalsa da üretilen son 100 satırlık Appium logunu GitLab paneline basar
    - echo "=== CRITIC APPIUM LOGS ==="
    - if exist appium.log ( powershell -Command "Get-Content appium.log -Tail 100" ) else ( echo Appium log dosyasi olusturulamadi! )
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - appium.log
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml