image: maven:3.6.3-jdk-11

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723/wd/hub"

stages:
  - build
  - quality
  - test
  - package
  - deploy

cache:
  paths:
    - .m2/repository

compile_project:
  stage: build
  script:
    - mvn clean compile

code_quality:
  stage: quality
  script:
    - mvn checkstyle:check || echo "Stil hatasi"
  allow_failure: true

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  script:
    - mvn test -Dappium.url=$APPIUM_URL
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/allure-results/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

build_package:
  stage: package
  script:
    - mvn package -DskipTests

# ✅ Allure Raporunu oluşturan ve GitLab Pages'e gönderen kısım
pages:
  stage: deploy
  image: frankescobar/allure-docker-service
  script:
    - allure generate target/allure-results -o public --clean
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deployment_status:
  stage: deploy
  script:
    - echo "Pipeline ve Raporlama Bitti"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH