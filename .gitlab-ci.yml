spec:
  inputs:
    single_tag_input:
      default: ""
      description: "SADECE 1 KEZ çalışacak Cucumber tag'ini girin (Örn: @Login veya @Setup). Boş bırakılabilir."
    loop_tag_input:
      default: ""
      description: "Arka arkaya 1000 KEZ döngüde çalışacak stres testi tag'ini girin (Örn: @SatisVeyaIptal). Boş bırakılabilir."

---

# 🚨 DOCKER KONTEYNERİNE MAVEN VE JAVA ALTYAPISINI ZORLA YÜKLÜYORUZ
image: maven:3.6.3-jdk-11

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # 🚨 Docker içinden kendi bilgisayarınızdaki (Host) Appium'a bağlanma adresi
  APPIUM_URL: "http://host.docker.internal:4723"
  SINGLE_TAG: "$[[ inputs.single_tag_input ]]"
  LOOP_TAG: "$[[ inputs.loop_tag_input ]]"

stages:
  - build
  - quality
  - test
  - package
  - deploy

cache:
  paths:
    - .m2/repository

compile_project:
  stage: build
  script:
    # Saf Linux ortamında doğrudan Maven derlemesi
    - mvn clean compile

code_quality:
  stage: quality
  script:
    - mvn checkstyle:check || echo "Stil hatasi"
  allow_failure: true

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  script:
    - echo "=== DOCKER ICINDE TEST KOSUL SURECI BASLIYOR ==="
    - |
      # Saf Linux Bash koşul blokları ve doğrudan mvn kullanımı
      if [ -n "$SINGLE_TAG" ]; then
          echo "🚀 SINGLE_TAG 1 kez kosuluyor -> $SINGLE_TAG"
          mvn test -Dappium.url=$APPIUM_URL -Dcucumber.filter.tags="$SINGLE_TAG"
      fi

      if [ -n "$LOOP_TAG" ]; then
          echo "🔄 LOOP_TAG 1000 kez donguye giriyor -> $LOOP_TAG"
          for i in {1..1000}; do
              echo "---------------- DONGU NO: $i / 1000 ----------------"
              mvn test -Dappium.url=$APPIUM_URL -Dcucumber.filter.tags="$LOOP_TAG"
          done
      fi

      if [ -z "$SINGLE_TAG" ] && [ -z "$LOOP_TAG" ]; then
          echo "⚠️ Ozel tag girilmedi, tum testler sirasiyla kosuluyor..."
          mvn test -Dappium.url=$APPIUM_URL
      fi
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/allure-results/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

build_package:
  stage: package
  script:
    - mvn package -DskipTests

pages:
  stage: deploy
  image: frankescobar/allure-docker-service
  script:
    - allure generate target/allure-results -o public --clean
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deployment_status:
  stage: deploy
  script:
    - echo "Pipeline ve Raporlama Bitti"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH