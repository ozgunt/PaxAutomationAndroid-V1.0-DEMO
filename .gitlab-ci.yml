spec:
  inputs:
    single_tag_input:
      default: ""
      description: "SADECE 1 KEZ çalışacak Cucumber tag'ini girin (Örn: @Login veya @Setup). Boş bırakılabilir."
    loop_tag_input:
      default: ""
      description: "Arka arkaya 1000 KEZ döngüde çalışacak stres testi tag'ini girin (Örn: @SatisVeyaIptal). Boş bırakılabilir."

---

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723"
  SINGLE_TAG: "$[[ inputs.single_tag_input ]]"
  LOOP_TAG: "$[[ inputs.loop_tag_input ]]"

stages:
  - build
  - test

compile_project:
  stage: build
  script:
    # Windows PowerShell üzerinde projenin içindeki gömülü Maven Wrapper'ı çalıştırıyoruz
    - PowerShell -Command "./mvnw.cmd clean compile"

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  before_script:
    - echo "=== WINDOWS ORTAMINDA APPIUM HAZIRLIGI ==="
    # Arka planda kalmış eski Appium/Node süreçleri varsa temizler
    - PowerShell -Command "Stop-Process -Name 'node' -Force -ErrorAction SilentlyContinue"
    # Appium'u arka planda başlatıp logları dosyaya yazar
    - echo "🚀 Appium Sunucusu Arka Planda Baslatiliyor..."
    - Start-Process cmd -ArgumentList '/c appium --log-level debug --log-no-colors > appium.log 2>&1' -WindowStyle Hidden
    # Sunucunun açılması için 5 saniye bekletir
    - PowerShell -Command "Start-Sleep -Seconds 5"
  script:
    - echo "=== TEST KOSUL SURECI BASLIYOR ==="
    - |
      PowerShell -Command "
      if ('$env:SINGLE_TAG' -ne '') {
          Write-Host '🚀 SINGLE_TAG 1 kez kosuluyor -> ' $env:SINGLE_TAG;
          ./mvnw.cmd test -Dappium.url=$env:APPIUM_URL -Dcucumber.filter.tags=$env:SINGLE_TAG;
      }
      elseif ('$env:LOOP_TAG' -ne '') {
          Write-Host '🔄 LOOP_TAG 1000 kez donguye giriyor -> ' $env:LOOP_TAG;
          for ($i=1; $i -le 1000; $i++) {
              Write-Host \"---------------- DONGU NO: $i / 1000 ----------------\";
              ./mvnw.cmd test -Dappium.url=$env:APPIUM_URL -Dcucumber.filter.tags=$env:LOOP_TAG;
          }
      }
      else {
          Write-Host '⚠️ Ozel tag girilmedi, tum testler sirasiyla kosuluyor...';
          ./mvnw.cmd test -Dappium.url=$env:APPIUM_URL;
      }"
  after_script:
    # Testler bitince oluşan son 50 satırlık Appium logunu panele basar
    - echo "=== APPIUM LOGLARI ==="
    - PowerShell -Command "if (Test-Path appium.log) { Get-Content appium.log -Tail 50 } else { Write-Host 'Appium log dosyasi olusturulamadi!' }"
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - appium.log
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml