spec:
  inputs:
    single_tag_input:
      default: ""
      description: "SADECE 1 KEZ çalışacak Cucumber tag'ini girin (Örn: @Login veya @Setup). Boş bırakılabilir."
    loop_tag_input:
      default: ""
      description: "Arka arkaya 1000 KEZ döngüde çalışacak stres testi tag'ini girin (Örn: @SatisVeyaIptal). Boş bırakılabilir."

---

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723"
  SINGLE_TAG: "$[[ inputs.single_tag_input ]]"
  LOOP_TAG: "$[[ inputs.loop_tag_input ]]"

stages:
  - build
  - test

compile_project:
  stage: build
  script:
    - mvn clean compile

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  before_script:
    - echo "=== WINDOWS ORTAMINDA ALTYAPI HAZIRLIGI ==="
    # 1. Eğer arka planda takılı kalmış eski Appium/Node süreçleri varsa temizliyoruz
    - taskkill /F /IM node.exe /T || echo "Aktif node (Appium) sureci bulunamadi."
    # 2. Appium sunucusunu arka planda başlatıp tüm logları appium.log dosyasına yazıyoruz
    - echo "🚀 Appium Sunucusu Arka Planda Baslatiliyor..."
    - start /B appium --log-level debug --log-no-colors > appium.log 2>&1
    # 3. Sunucunun tamamen uyanması için Windows ping komutuyla 5 saniye bekletiyoruz
    - ping 127.0.0.1 -n 6 > nul
  script:
    - echo "=== TEST KOSUL SÜRECI BASLIYOR ==="
    
    # SENARYO 1: Eğer sadece SINGLE_TAG girildiyse (1 kez çalıştırır)
    - if not "%SINGLE_TAG%"=="" ( echo SINGLE_TAG kosuluyor... && mvn test -Dappium.url=%APPIUM_URL% -Dcucumber.filter.tags="%SINGLE_TAG%" )

    # SENARYO 2: Eğer LOOP_TAG girildiyse (Windows CMD döngüsüyle 1000 kez arka arkaya çalıştırır)
    - if not "%LOOP_TAG%"=="" ( echo LOOP_TAG 1000 kez donguye giriyor... && for /L %i in (1,1,1000) do ( echo ---------------- DONGU NO: %i ---------------- && mvn test -Dappium.url=%APPIUM_URL% -Dcucumber.filter.tags="%LOOP_TAG%" ) )

    # SENARYO 3: Eğer her iki input alanı da boş bırakıldıysa (Tüm testleri sırayla koşar)
    - if "%SINGLE_TAG%"=="" if "%LOOP_TAG%"=="" ( echo Ozel tag girilmedi, tum testler sirasiyla kosuluyor... && mvn test -Dappium.url=%APPIUM_URL% )

  after_script:
    # Testler geçse de kalsa da üretilen son 100 satırlık Appium logunu GitLab paneline basar
    - echo "=== CRITIC APPIUM LOGS ==="
    - if exist appium.log ( powershell -Command "Get-Content appium.log -Tail 100" ) else ( echo Appium log dosyasi olusturulamadi! )
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - appium.log
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    