spec:
  inputs:
    test_filter_input:
      default: ""
      description: "Çalıştırmak istediğiniz test metodunu veya Cucumber tag'ini girin. (Örn: @SmokeTest veya PaymentTests#testSale) Boş bırakılırsa tüm testler koşar."
---
image: maven:3.6.3-jdk-11

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723"
  TEST_FILTER: "$[[ inputs.test_filter_input ]]"

stages:
  - build
  - quality
  - test
  - package
  - deploy

cache:
  paths:
    - .m2/repository

compile_project:
  stage: build
  script:
    - mvn clean compile

code_quality:
  stage: quality
  script:
    - mvn checkstyle:check || echo "Stil hatasi"
  allow_failure: true

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  script:
    - echo "Fiziksel POS Bağlantısı Kontrol Ediliyor..."
    - adb devices || echo "adb komutu veya bağlı cihaz bulunamadı, adımlara devam ediliyor..."
    - echo "Test Filtresi Kontrol Ediliyor -> $TEST_FILTER"
    - |
      if [ -z "$TEST_FILTER" ]; then
        echo "Herhangi bir filtre algılanmadı, tüm testler koşturuluyor..."
        mvn test -Dappium.url=$APPIUM_URL
      elif [[ "$TEST_FILTER" == @* ]]; then
        echo "Cucumber Tagi Algılandı! Koşturulacak Tag -> $TEST_FILTER"
        mvn test -Dappium.url=$APPIUM_URL -Dcucumber.filter.tags="$TEST_FILTER"
      else
        echo "Standart Java Test/Metot Filtresi Algılandı! Koşturulacak Test -> $TEST_FILTER"
        mvn test -Dappium.url=$APPIUM_URL -Dtest="$TEST_FILTER"
      fi
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/allure-results/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

build_package:
  stage: package
  script:
    - mvn package -DskipTests

pages:
  stage: deploy
  image: frankescobar/allure-docker-service
  script:
    - allure generate target/allure-results -o public --clean
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deployment_status:
  stage: deploy
  script:
    - echo "Pipeline ve Raporlama Bitti"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH