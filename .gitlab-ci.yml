spec:
  inputs:
    single_tag_input:
      default: ""
      description: "SADECE 1 KEZ çalışacak Cucumber tag'ini girin (Örn: @Login veya @Setup). Boş bırakılabilir."
    loop_tag_input:
      default: ""
      description: "Arka arkaya 1000 KEZ döngüde çalışacak stres testi tag'ini girin (Örn: @SatisVeyaIptal). Boş bırakılabilir."

---

image: maven:3.6.3-jdk-11

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723"
  SINGLE_TAG: "$[[ inputs.single_tag_input ]]"
  LOOP_TAG: "$[[ inputs.loop_tag_input ]]"

stages:
  - build
  - quality
  - test
  - package
  - deploy

cache:
  paths:
    - .m2/repository

compile_project:
  stage: build
  script:
    - mvn clean compile

code_quality:
  stage: quality
  script:
    - mvn checkstyle:check || echo "Stil hatasi"
  allow_failure: true

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  before_script:
    - echo "=== Appium ve Sürücü Kurulumu Başlıyor ==="
    # 1. Node.js ve npm ortamını Docker içine kuruyoruz
    - apt-get update && apt-get install -y curl gnupg
    - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
    - apt-get install -y nodejs
    # 2. Appium ve UiAutomator2 sürücüsünü yüklüyoruz (UiAutomator2 sorusunun çözümü)
    - npm install -g appium
    - appium driver install uiautomator2
    # 3. Appium'u arka planda başlatıyor ve logları 'appium.log' dosyasına yazıyoruz
    - echo "🚀 Appium Server Başlatılıyor..."
    - appium --log-level debug --log-no-colors > appium.log 2>&1 &
    # Appium'un tamamen açılması için 5 saniye bekletiyoruz
    - sleep 5
    # Appium'un çalışıp çalışmadığını logdan kontrol etmek için ilk satırları basıyoruz
    - head -n 20 appium.log
  script:
    - echo "Fiziksel POS Test Süreci Başlıyor..."
    
    # 1️⃣ ADIM: Eğer SINGLE_TAG tanımlandıysa sadece 1 Kere çalıştırır
    - |
      if [ -n "$SINGLE_TAG" ]; then
        echo "🚀 SINGLE_TAG 1 kez koşturuluyor -> $SINGLE_TAG"
        mvn test -Dappium.url=$APPIUM_URL -Dcucumber.filter.tags="$SINGLE_TAG"
      else
        echo "ℹ️ SINGLE_TAG boş bırakıldı, bu adım atlanıyor."
      fi

    # 2️⃣ ADIM: Eğer LOOP_TAG tanımlandıysa arka arkaya 1000 Kez döngüye sokar
    - |
      if [ -n "$LOOP_TAG" ]; then
        echo "🔄 LOOP_TAG 1000 kez döngüsel teste giriyor -> $LOOP_TAG"
        for i in {1..1000}; do
          echo "========================================="
          echo "       DÖNGÜ KOŞUSU: $i / 1000           "
          echo "========================================="
          mvn test -Dappium.url=$APPIUM_URL -Dcucumber.filter.tags="$LOOP_TAG"
        done
      else
        echo "ℹ️ LOOP_TAG boş bırakıldı, döngü testi yapılmayacak."
      fi

    # 3️⃣ ADIM: Eğer iki input alanı da boş bırakıldıysa standart akış (tüm testler) çalışır
    - |
      if [ -z "$SINGLE_TAG" ] && [ -z "$LOOP_TAG" ]; then
        echo "⚠️ Herhangi bir özel döngü inputu girilmedi. Tüm testler sırasıyla koşturuluyor..."
        mvn test -Dappium.url=$APPIUM_URL
      fi
  after_script:
    # Testler bitse de hata alsa da en son Appium loglarını terminale bas ki hata görünür olsun
    - echo "=== APPIUM LOGLARI ==="
    - cat appium.log || echo "Appium log dosyası bulunamadı."
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/allure-results/
      - appium.log               # Log dosyasını GitLab arayüzünden indirebilmek için buraya ekledik
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

build_package:
  stage: package
  script:
    - mvn package -DskipTests

pages:
  stage: deploy
  image: frankescobar/allure-docker-service
  script:
    - allure generate target/allure-results -o public --clean
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deployment_status:
  stage: deploy
  script:
    - echo "Pipeline ve Raporlama Bitti"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH