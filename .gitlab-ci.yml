spec:
  inputs:
    single_tag_input:
      default: ""
      description: "SADECE 1 KEZ çalışacak Cucumber tag'ini girin (Örn: @Login veya @Setup). Boş bırakılabilir."
    loop_tag_input:
      default: ""
      description: "Arka arkaya 1000 KEZ döngüde çalışacak stres testi tag'ini girin (Örn: @SatisVeyaIptal). Boş bırakılabilir."

---

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  APPIUM_URL: "http://127.0.0.1:4723"
  SINGLE_TAG: "$[[ inputs.single_tag_input ]]"
  LOOP_TAG: "$[[ inputs.loop_tag_input ]]"

stages:
  - build
  - quality
  - test
  - package
  - deploy

cache:
  paths:
    - .m2/repository

compile_project:
  stage: build
  script:
    - mvn clean compile

code_quality:
  stage: quality
  script:
    - mvn checkstyle:check || echo "Stil hatasi"
  allow_failure: true

pos_automation_tests:
  stage: test
  tags:
    - pos-runner
  before_script:
    - echo "=== Windows Ortaminda Appium Kontrol Ediliyor ==="
    # Eski kalıntı Appium süreçleri varsa Windows'ta temizliyoruz (Port çakışmasını önler)
    - PowerShell -Command "Stop-Process -Name 'node' -Force -ErrorAction SilentlyContinue"
    # Appium'u Windows arka planında başlatıp logları dosyaya yazıyoruz
    - echo "🚀 Appium Server Arka Planda Başlatılıyor..."
    - start /B appium --log-level debug --log-no-colors > appium.log 2>&1
    # Appium'un ayağa kalkması için 5 saniye bekleme (Windows uyumlu)
    - PowerShell -Command "Start-Sleep -Seconds 5"
  script:
    - echo "Fiziksel POS Test Süreci Başlıyor..."
    
    # 1️⃣ ADIM: SINGLE_TAG kontrolü (Windows PowerShell mantığıyla)
    - |
      PowerShell -Command "
      if ('$env:SINGLE_TAG' -ne '') {
          Write-Host '🚀 SINGLE_TAG 1 kez kos-turuluyor -> $env:SINGLE_TAG';
          mvn test -Dappium.url=$env:APPIUM_URL -Dcucumber.filter.tags='$env:SINGLE_TAG';
      } else {
          Write-Host 'ℹ️ SINGLE_TAG bos birakildi, bu adim atlaniyor.';
      }"

    # 2️⃣ ADIM: LOOP_TAG 1000 Kez Döngü kontrolü (Windows PowerShell mantığıyla)
    - |
      PowerShell -Command "
      if ('$env:LOOP_TAG' -ne '') {
          Write-Host '🔄 LOOP_TAG 1000 kez dongusel teste giriyor -> $env:LOOP_TAG';
          for ($i=1; $i -le 1000; $i++) {
              Write-Host '=========================================';
              Write-Host \"       DONGU KOSUSU: $i / 1000           \";
              Write-Host '=========================================';
              mvn test -Dappium.url=$env:APPIUM_URL -Dcucumber.filter.tags='$env:LOOP_TAG';
          }
      } else {
          Write-Host 'ℹ️ LOOP_TAG bos birakildi, dongu testi yapilmayacak.';
      }"

    # 3️⃣ ADIM: İki input da boşsa tüm testleri çalıştır (Windows PowerShell mantığıyla)
    - |
      PowerShell -Command "
      if ('$env:SINGLE_TAG' -eq '' -and '$env:LOOP_TAG' -eq '') {
          Write-Host '⚠️ Herhangi bir ozel dongu inputu girilmedi. Tum testler sirasiyla kos-turuluyor...';
          mvn test -Dappium.url=$env:APPIUM_URL;
      }"
  after_script:
    # Test bitiminde ne olursa olsun oluşan log dosyasını ekrana basıyoruz
    - echo "=== APPIUM LOGLARI ==="
    - PowerShell -Command "if (Test-Path appium.log) { Get-Content appium.log -Tail 50 } else { Write-Host 'Appium log dosyasi bulunamadi.' }"
  allow_failure: true
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/allure-results/
      - appium.log
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

build_package:
  stage: package
  script:
    - mvn package -DskipTests

pages:
  stage: deploy
  image: frankescobar/allure-docker-service
  script:
    - allure generate target/allure-results -o public --clean
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deployment_status:
  stage: deploy
  script:
    - echo "Pipeline ve Raporlama Bitti"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    